version: '3.8'

services:

  zookeeper:            # Container 1 — Zookeeper
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181   # Port Kafka uses to talk to Zookeeper
      ZOOKEEPER_TICK_TIME: 2000

  kafka:                # Container 2 — Kafka broker
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper       # Don't start Kafka until Zookeeper is ready
    ports:
      - "9092:9092"     # Expose Kafka on  port 9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1  # 1 = no replication (dev only)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true