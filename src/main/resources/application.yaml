spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/finflowdb}
    username: ${SPRING_DATASOURCE_USERNAME:finflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:finflow_pass}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: finflow-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "transactionRecordedEvent:com.harikrishnan.finflow.transaction.event.TransactionRecordedEvent"
  cache:
    type: ${SPRING_CACHE_TYPE:none}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}


jwt:
  secret: ${JWT_SECRET:L0FDSa6l38+QI6Vm41XjYppZD4BRbcncpMa/oQA+qdg=}
  accessTokenExpiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm.jdbc.bind: TRACE
